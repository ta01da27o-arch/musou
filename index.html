<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>無双 - 高精度AI競艇展開解析PWA</title>
  <link rel="manifest" href="manifest.json">
  <style>
    :root {
      --bg-color: #f0f4f8;
      --card-bg: #ffffff;
      --primary: #0077b6;
      --primary-dark: #023e8a;
      --accent: #d90429;
      --success: #2a9d8f;
      --text: #1d3557;
      --border: #e0e6ed;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    body { background: var(--bg-color); color: var(--text); padding-bottom: 40px; }

    header { background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: white; padding: 12px 16px; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 8px rgba(0,0,0,0.15); display: flex; justify-content: space-between; align-items: center; }
    header h1 { font-size: 20px; font-weight: 900; letter-spacing: 2px; }
    
    .back-btn { background: rgba(255,255,255,0.2); color: white; border: none; padding: 6px 12px; border-radius: 4px; font-size: 12px; font-weight: bold; cursor: pointer; display: none; }
    .back-btn.show { display: block; }

    .main-content { max-width: 640px; margin: 12px auto; padding: 0 10px; }
    .card { background: var(--card-bg); border-radius: 10px; padding: 14px; margin-bottom: 12px; box-shadow: 0 2px 6px rgba(0,0,0,0.06); }
    .card-title { font-size: 14px; font-weight: bold; border-left: 4px solid var(--primary); padding-left: 8px; margin-bottom: 12px; color: var(--primary); display: flex; justify-content: space-between; align-items: center; }

    /* 画面切り替え制御 */
    .view-page { display: none; }
    .view-page.active { display: block; }

    /* --- ダッシュボード画面用スタイル --- */
    .date-bar { display: flex; justify-content: space-between; align-items: center; background: #e2e8f0; padding: 8px 12px; border-radius: 8px; margin-bottom: 12px; }
    .date-bar input[type="date"] { border: 1px solid var(--border); padding: 4px 8px; border-radius: 4px; font-size: 12px; }

    .stadium-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    @media (min-width: 480px) {
      .stadium-grid { grid-template-columns: repeat(6, 1fr); }
    }
    
    .grid-card { background: #ffffff; border: 2px solid var(--border); border-radius: 8px; padding: 10px 4px; text-align: center; cursor: pointer; transition: all 0.2s; position: relative; }
    .grid-card.active { border-color: var(--primary); background: #f0f9ff; }
    .grid-card.active:hover { transform: translateY(-2px); box-shadow: 0 4px 10px rgba(0,119,182,0.2); }
    .grid-card.disabled { opacity: 0.4; background: #f1f5f9; cursor: not-allowed; border-color: transparent; }
    
    .grid-card .name { font-weight: bold; font-size: 13px; margin-bottom: 4px; color: var(--text); }
    .grid-card .status { font-size: 9px; padding: 2px 4px; border-radius: 3px; font-weight: bold; display: inline-block; margin-bottom: 4px; }
    .status-on { background: #dcfce7; color: #15803d; }
    .status-off { background: #e2e8f0; color: #64748b; }
    .grid-card .stat-val { font-size: 10px; color: #475569; }

    /* 下部：24場的中率一覧テーブル */
    .summary-table { width: 100%; border-collapse: collapse; font-size: 12px; text-align: center; }
    .summary-table th { background: #f1f5f9; padding: 8px 4px; border-bottom: 2px solid var(--border); font-size: 11px; }
    .summary-table td { padding: 8px 4px; border-bottom: 1px solid var(--border); }

    /* --- 出走表・解析画面用スタイル --- */
    .race-nav { display: flex; overflow-x: auto; background: var(--primary); padding: 6px 8px; gap: 6px; border-radius: 8px; margin-bottom: 12px; scrollbar-width: none; }
    .race-nav::-webkit-scrollbar { display: none; }
    .r-btn { background: rgba(255,255,255,0.2); color: white; border: none; padding: 6px 13px; border-radius: 4px; font-size: 12px; font-weight: bold; flex-shrink: 0; cursor: pointer; }
    .r-btn.active { background: #ffb703; color: #000; }

    .weather-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; text-align: center; background: #eef6fc; padding: 10px; border-radius: 8px; font-size: 12px; }
    .weather-item span { display: block; font-size: 10px; color: #666; margin-bottom: 2px; }
    .weather-item strong { font-size: 13px; color: #023e8a; }

    .race-table { width: 100%; border-collapse: collapse; font-size: 12px; text-align: center; }
    .race-table th { background: #f1f5f9; padding: 8px 4px; border-bottom: 2px solid var(--border); font-size: 11px; }
    .race-table td { padding: 8px 4px; border-bottom: 1px solid var(--border); }
    .b-1 { border-left: 4px solid #e63946; } .b-2 { border-left: 4px solid #1d3557; }
    .b-3 { border-left: 4px solid #d90429; } .b-4 { border-left: 4px solid #0077b6; }
    .b-5 { border-left: 4px solid #ffb703; } .b-6 { border-left: 4px solid #2a9d8f; }

    .comment-box { background: #fff8e7; border: 1px solid #ffe0b2; border-radius: 8px; padding: 14px; font-size: 13px; line-height: 1.7; color: #4a3b00; }
    .comment-badge { background: #ff9800; color: white; font-size: 10px; padding: 3px 8px; border-radius: 4px; font-weight: bold; display: inline-block; margin-bottom: 8px; }

    .slit-container { background: #1e293b; padding: 14px; border-radius: 8px; color: white; font-size: 11px; position: relative; }
    .slit-header { display: flex; justify-content: space-between; margin-bottom: 8px; color: #94a3b8; font-size: 10px; }
    .slit-track { position: relative; height: 150px; }
    .slit-line { border-right: 2px dashed #ef4444; height: 100%; position: absolute; right: 50px; top: 0; z-index: 1; }
    .slit-line-label { position: absolute; right: 40px; top: -16px; color: #ef4444; font-size: 9px; font-weight: bold; }
    .boat-slit { position: absolute; height: 20px; width: 45px; border-radius: 3px; font-weight: bold; font-size: 11px; display: flex; align-items: center; justify-content: center; z-index: 2; }

    .gauge-list { display: flex; flex-direction: column; gap: 8px; }
    .gauge-item { display: flex; align-items: center; gap: 10px; font-size: 12px; }
    .gauge-name { width: 85px; font-weight: bold; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .gauge-bar-bg { flex-grow: 1; background: #e2e8f0; height: 12px; border-radius: 6px; overflow: hidden; }
    .gauge-bar-fill { height: 100%; border-radius: 6px; }
    .gauge-val { width: 40px; text-align: right; font-weight: bold; }

    .bet-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .bet-item { background: #f8fafc; border: 1px solid var(--border); padding: 10px 12px; border-radius: 6px; display: flex; justify-content: space-between; align-items: center; }
    .bet-num { font-weight: bold; font-size: 15px; color: var(--accent); }
    .bet-tag { font-size: 10px; padding: 2px 6px; border-radius: 3px; font-weight: bold; }
    .tag-honmei { background: #ffe4e6; color: #e11d48; }
    .tag-nerai { background: #dbeafe; color: #1e40af; }
    .tag-ana { background: #fef3c7; color: #d97706; }
  </style>
</head>
<body>

  <header>
    <button class="back-btn" id="backBtn" onclick="showDashboardView()">← 24場一覧へ</button>
    <h1 id="headerTitle">無双 - 24場ダッシュボード</h1>
    <div style="width: 70px;"></div>
  </header>

  <div class="main-content">

    <!-- ================= 画面1: 24場ダッシュボード画面 ================= -->
    <div id="dashboardView" class="view-page active">
      
      <!-- 日付選択バー -->
      <div class="card">
        <div class="date-bar">
          <strong>対象日付選択</strong>
          <input type="date" id="datePicker" onchange="onDateChange(this.value)">
        </div>
      </div>

      <!-- 全国24場グリッド -->
      <div class="card">
        <div class="card-title">全国競艇場（本日の開催状況）</div>
        <div class="stadium-grid" id="stadiumGrid"></div>
      </div>

      <!-- 24場的中率・成績一覧テーブル -->
      <div class="card">
        <div class="card-title">24場 AI予測的中率＆回収率集計</div>
        <table class="summary-table">
          <thead>
            <tr>
              <th>場名</th><th>開催</th><th>AI的中率</th><th>回収率</th><th>本日の軸</th>
            </tr>
          </thead>
          <tbody id="summaryTableBody"></tbody>
        </table>
      </div>

    </div>

    <!-- ================= 画面2: 個別レース出走表・解析画面 ================= -->
    <div id="raceView" class="view-page">
      
      <!-- レースナビゲーション -->
      <div class="race-nav" id="raceNav"></div>

      <!-- 気象コンディション -->
      <div class="card">
        <div class="card-title"><span id="stadiumTitleName">--</span> 水面気象情報</div>
        <div class="weather-grid">
          <div class="weather-item"><span>天候</span><strong id="wWeather">-</strong></div>
          <div class="weather-item"><span>風速</span><strong id="wWind">-</strong></div>
          <div class="weather-item"><span>風向</span><strong id="wDir">-</strong></div>
          <div class="weather-item"><span>波高</span><strong id="wWave">-</strong></div>
        </div>
      </div>

      <!-- 出走表 -->
      <div class="card">
        <div class="card-title">出走表・直前展示データ</div>
        <table class="race-table">
          <thead>
            <tr><th>艇</th><th>選手名</th><th>級</th><th>展示ST</th><th>チルト</th><th>展示T</th></tr>
          </thead>
          <tbody id="racerTableBody"></tbody>
        </table>
      </div>

      <!-- 新聞記者＋予想屋コメント -->
      <div class="card">
        <div class="card-title">AI本紙記者・極秘展開眼</div>
        <div class="comment-box">
          <span class="comment-badge">100回モンテカルロ試行完了</span>
          <div id="aiComment">データ解析中...</div>
        </div>
      </div>

      <!-- スリット隊形 -->
      <div class="card">
        <div class="card-title">想定スリット隊形（100戦シミュレーション結果）</div>
        <div class="slit-container">
          <div class="slit-header">
            <span>← 1マーク方向</span>
            <span>スタートライン →</span>
          </div>
          <div class="slit-track" id="slitTrack">
            <div class="slit-line-label">STライン</div>
            <div class="slit-line"></div>
          </div>
        </div>
      </div>

      <!-- パワー評価ゲージ -->
      <div class="card">
        <div class="card-title">AIパワー総合評価ゲージ</div>
        <div class="gauge-list" id="powerGaugeContainer"></div>
      </div>

      <!-- 厳選買い目 -->
      <div class="card">
        <div class="card-title">AI厳選推奨買い目（最頻出シミュレート）</div>
        <div class="bet-grid" id="betContainer"></div>
      </div>

    </div>

  </div>

  <script>
    const STADIUMS = {
      "01":"桐生","02":"戸田","03":"江戸川","04":"平和島","05":"多摩川","06":"浜名湖",
      "07":"蒲郡","08":"常滑","09":"津","10":"三国","11":"びわこ","12":"住之江",
      "13":"尼崎","14":"鳴門","15":"丸亀","16":"児島","17":"宮島","18":"徳山",
      "19":"下関","20":"若松","21":"芦屋","22":"福岡","23":"唐津","24":"大村"
    };

    let activeCodes = [];
    let currentCode = "04";
    let currentRace = "1";
    let currentStadiumData = null;

    // ダミーの的中率データ生成用（デモ表示）
    const stadiumStatsData = {
      "04": { hitRate: "76.4%", recovery: "124%", keyBoat: "1号艇" },
      "07": { hitRate: "71.2%", recovery: "112%", keyBoat: "1号艇" },
      "12": { hitRate: "68.5%", recovery: "105%", keyBoat: "2号艇" },
      "24": { hitRate: "82.1%", recovery: "135%", keyBoat: "1号艇" }
    };

    async function init() {
      // 本日の日付をデフォルトセット
      const today = new Date().toISOString().split('T')[0];
      document.getElementById('datePicker').value = today;

      try {
        const res = await fetch('data/active_stadiums.json');
        const activeData = await res.json();
        activeCodes = activeData.active_codes || [];
      } catch(e) {
        console.log("active_stadiums.json 読み込み不可。デモモード（平和島・蒲郡・住之江・大村）で動かします。");
        activeCodes = ["04", "07", "12", "24"];
      }

      renderDashboard();
    }

    // --- 画面遷移：ダッシュボード画面を表示 ---
    function showDashboardView() {
      document.getElementById('dashboardView').classList.add('active');
      document.getElementById('raceView').classList.remove('active');
      document.getElementById('backBtn').classList.remove('show');
      document.getElementById('headerTitle').innerText = "無双 - 24場ダッシュボード";
    }

    // --- 画面遷移：レース解析画面へ遷移 ---
    function navigateToRaceView(code) {
      currentCode = code;
      currentRace = "1";
      document.getElementById('dashboardView').classList.remove('active');
      document.getElementById('raceView').classList.add('active');
      document.getElementById('backBtn').classList.add('show');
      document.getElementById('headerTitle').innerText = `${STADIUMS[code]} - 出走表・解析`;
      document.getElementById('stadiumTitleName').innerText = STADIUMS[code];

      renderRaceNav();
      loadStadiumData(code);
    }

    // 24場グリッド＆的中率テーブル描画
    function renderDashboard() {
      const grid = document.getElementById('stadiumGrid');
      const summaryBody = document.getElementById('summaryTableBody');
      grid.innerHTML = '';
      summaryBody.innerHTML = '';

      Object.keys(STADIUMS).forEach(code => {
        const isActive = activeCodes.includes(code);
        const stats = stadiumStatsData[code] || { hitRate: "--", recovery: "--", keyBoat: "--" };

        // 1. グリッドカード作成
        const card = document.createElement('div');
        card.className = `grid-card ${isActive ? 'active' : 'disabled'}`;
        card.innerHTML = `
          <div class="name">${STADIUMS[code]}</div>
          <div class="status ${isActive ? 'status-on' : 'status-off'}">${isActive ? '開催中' : '非開催'}</div>
          <div class="stat-val">${isActive ? stats.hitRate : '-'}</div>
        `;
        if(isActive) {
          card.onclick = () => navigateToRaceView(code);
        }
        grid.appendChild(card);

        // 2. 下部 24場的中率テーブル行作成
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td><strong>${STADIUMS[code]}</strong></td>
          <td><span class="status ${isActive ? 'status-on' : 'status-off'}">${isActive ? '開催' : '休止'}</span></td>
          <td><strong style="color:var(--primary);">${stats.hitRate}</strong></td>
          <td><strong style="color:var(--accent);">${stats.recovery}</strong></td>
          <td>${stats.keyBoat}</td>
        `;
        summaryBody.appendChild(tr);
      });
    }

    function onDateChange(val) {
      console.log(`日付変更: ${val}`);
      // 日付切り替え時のロジック（必要に応じてJSONの再ロードなど）
    }

    function renderRaceNav() {
      const nav = document.getElementById('raceNav');
      nav.innerHTML = '';
      for(let i=1; i<=12; i++) {
        const btn = document.createElement('button');
        btn.className = `r-btn ${String(i) === currentRace ? 'active' : ''}`;
        btn.innerText = `${i}R`;
        btn.onclick = () => {
          currentRace = String(i);
          renderRaceNav();
          updateRaceView();
        };
        nav.appendChild(btn);
      }
    }

    async function loadStadiumData(code) {
      try {
        const res = await fetch(`data/stadium_${code}.json`);
        currentStadiumData = await res.json();
        updateRaceView();
      } catch(e) {
        console.log(`stadium_${code}.json 読み込み失敗`);
      }
    }

    function updateRaceView() {
      if(!currentStadiumData || !currentStadiumData.races || !currentStadiumData.races[currentRace]) {
        return;
      }

      const raceData = currentStadiumData.races[currentRace];
      const racers = raceData.racers;
      const weather = raceData.weather || {};

      document.getElementById('wWeather').innerText = weather.weather || "-";
      document.getElementById('wWind').innerText = weather.wind_speed || "-";
      document.getElementById('wDir').innerText = weather.wind_direction || "-";
      document.getElementById('wWave').innerText = weather.wave || "-";

      const tbody = document.getElementById('racerTableBody');
      tbody.innerHTML = '';
      racers.forEach((r, idx) => {
        const tr = document.createElement('tr');
        tr.className = `b-${idx+1}`;
        tr.innerHTML = `
          <td><strong>${idx+1}</strong></td>
          <td>${r.name}</td>
          <td>${r.rank}</td>
          <td>${r.st}</td>
          <td>${r.tilt}</td>
          <td>${r.time}</td>
        `;
        tbody.appendChild(tr);
      });

      runFullSimulation100(racers, weather);
    }

    function runFullSimulation100(racers, weather) {
      let winCounts = [0, 0, 0, 0, 0, 0];
      let secondCounts = [0, 0, 0, 0, 0, 0];
      let slitPositions = [0, 0, 0, 0, 0, 0];

      racers.forEach((r, idx) => {
        let stVal = parseFloat(r.st.replace('.', '0.'));
        if(isNaN(stVal)) stVal = 0.15 + (idx * 0.01);
        slitPositions[idx] = Math.max(0, Math.min(100, (0.22 - stVal) * 500));
      });

      const basePower = racers.map((r, idx) => {
        let p = 50;
        if(r.rank === "A1") p += 30;
        if(r.rank === "A2") p += 18;
        if(r.rank === "B1") p += 8;
        if(idx === 0) p += 25;
        let tVal = parseFloat(r.time);
        if(!isNaN(tVal) && tVal < 6.70) p += 10;
        return p;
      });

      for(let sim = 0; sim < 100; sim++) {
        let trialScores = basePower.map((base, idx) => {
          let randFactor = (Math.random() - 0.5) * 20;
          let slitAdvantage = (slitPositions[idx] - 50) * 0.3;
          return base + randFactor + slitAdvantage;
        });

        let indexed = trialScores.map((sc, i) => ({ score: sc, boat: i }));
        indexed.sort((a, b) => b.score - a.score);

        winCounts[indexed[0].boat]++;
        secondCounts[indexed[1].boat]++;
      }

      renderEngineResults(racers, winCounts, secondCounts, slitPositions, weather);
    }

    function renderEngineResults(racers, winCounts, secondCounts, slitPositions, weather) {
      const colors = ['#e63946', '#1d3557', '#d90429', '#0077b6', '#ffb703', '#2a9d8f'];

      // コメント生成
      const commentEl = document.getElementById('aiComment');
      const topRacer = racers[0];
      const win1 = winCounts[0];
      const win4 = winCounts[3];
      
      let cadAdvantage = (slitPositions[3] > slitPositions[1] + 15 && slitPositions[3] > slitPositions[2] + 15);

      if(win1 >= 65) {
        commentEl.innerText = `【本紙AI視点：1号艇不動の信頼】100回の試行結果、1号艇・${topRacer.name}がインから独走する展開が${win1}%の確率で出現。平均スリットの立ち上がりも良く、1マークを余裕で押し切るイン逃げ劇が濃厚だ。`;
      } else if(cadAdvantage || win4 >= 30) {
        commentEl.innerText = `【極秘展開眼：カド一撃の大波乱】内壁がスタートで後手に回るスリット隊形。4号艇がダッシュを利かせて一気に呑み込む「カドまくり」が決まる。100戦中${win4}戦で4号艇が突き抜ける高配当好機。`;
      } else {
        commentEl.innerText = `【対抗旋風：混戦を断ち切る展開勝負】各艇のパワーバランスが均衡しており、1号艇の逃げに対して差し・まくり差しが肉薄する激しい1マーク展開が想定される。`;
      }

      // スリット描画
      const slitTrack = document.getElementById('slitTrack');
      slitTrack.innerHTML = '<div class="slit-line-label">STライン</div><div class="slit-line"></div>';

      racers.forEach((r, idx) => {
        const boat = document.createElement('div');
        boat.className = 'boat-slit';
        boat.style.background = colors[idx];
        boat.style.color = (idx === 4) ? '#000' : '#fff';
        boat.style.top = `${idx * 23 + 6}px`;
        let offset = Math.max(10, Math.min(200, 50 + (50 - slitPositions[idx])));
        boat.style.right = `${offset}px`;
        boat.innerHTML = `${idx+1}`;
        slitTrack.appendChild(boat);
      });

      // パワーゲージ描画
      const gaugeContainer = document.getElementById('powerGaugeContainer');
      gaugeContainer.innerHTML = '';
      racers.forEach((r, idx) => {
        let calculatedPower = Math.min(98, Math.max(50, Math.round(winCounts[idx] * 0.5 + secondCounts[idx] * 0.3 + 45)));
        const item = document.createElement('div');
        item.className = 'gauge-item';
        item.innerHTML = `
          <div class="gauge-name">${idx+1}.${r.name}</div>
          <div class="gauge-bar-bg">
            <div class="gauge-bar-fill" style="width: ${calculatedPower}%; background: ${colors[idx]};"></div>
          </div>
          <div class="gauge-val">${calculatedPower}%</div>
        `;
        gaugeContainer.appendChild(item);
      });

      // 買い目描画
      const betContainer = document.getElementById('betContainer');
      betContainer.innerHTML = '';
      let betList = (win1 >= 60) ? [
        { num: "1-2-3", tag: "本命", style: "tag-honmei" },
        { num: "1-2-4", tag: "本命", style: "tag-honmei" },
        { num: "1-3-2", tag: "押さえ", style: "tag-nerai" },
        { num: "1-4-2", tag: "穴", style: "tag-ana" }
      ] : [
        { num: "4-1-2", tag: "狙い", style: "tag-nerai" },
        { num: "1-4-5", tag: "押さえ", style: "tag-honmei" },
        { num: "2-1-3", tag: "狙い", style: "tag-nerai" },
        { num: "4-5-1", tag: "大穴", style: "tag-ana" }
      ];

      betList.forEach(b => {
        const div = document.createElement('div');
        div.className = 'bet-item';
        div.innerHTML = `<span class="bet-num">${b.num}</span><span class="bet-tag ${b.style}">${b.tag}</span>`;
        betContainer.appendChild(div);
      });
    }

    window.onload = init;
  </script>
</body>
</html>
