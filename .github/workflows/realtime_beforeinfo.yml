name: 2. 展示データ高速更新 (10分毎)

on:
  schedule:
    - cron: '*/10 0-12 * * *' # 日本時間 9:00〜21:00 の間 10分毎
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - run: pip install beautifulsoup4
      - run: python fetch_beforeinfo.py
      - name: Commit & Push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add stadium_*.json data.json
          git commit -m "Update live beforeinfo" || exit 0
          git push
