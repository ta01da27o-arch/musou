name: Run BoatRace Data Fetcher

on:
  schedule:
    # 日本時間（JST）朝 8:00 〜 夜 21:50 の間、10分おきに自動実行
    # UTC換算: 前日23:00 〜 当日12:50
    - cron: '*/10 23 * * *'    # JST 08:00 - 08:50 (UTC 23:00 - 23:50)
    - cron: '*/10 0-12 * * *'  # JST 09:00 - 21:50 (UTC 00:00 - 12:50)
  workflow_dispatch:

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run fetch_data.py
        run: python fetch_data.py

      - name: Commit and push updated data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -f *.json
          git commit -m "Auto update race & before info [$(date +'%Y-%m-%d %H:%M:%S')]" || echo "No changes to commit"
          git push origin HEAD:${{ github.ref_name }}
