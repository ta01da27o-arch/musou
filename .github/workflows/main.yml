name: Run BoatRace Data Fetcher

on:
  schedule:
    # 毎日 午前8時 (JST) に自動実行 (UTC 23:00)
    - cron: '0 23 * * *'
  workflow_dispatch: # 手動実行ボタンを有効化

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
      # 1. リポジトリのチェックアウト (Node.js 24対応のv4に更新)
      - name: Check out repository
        uses: actions/checkout@v4

      # 2. Python環境のセットアップ (Node.js 24対応のv5に更新)
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip' # キャッシュを使用して実行時間を短縮

      # 3. 依存ライブラリのインストール
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # 4. データ取得スクリプトの実行
      - name: Run fetch_data.py
        run: python fetch_data.py

      # 5. 生成されたデータ (data.json / stadium_XX.json) をGitHubへ自動コミット＆Push
      - name: Commit and push updated data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data.json stadium_*.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto update race data [$(date +'%Y-%m-%d %H:%M:%S')]" && git push)
